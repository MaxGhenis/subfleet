[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subfleet"
version = "0.1.0"
description = "subfleet — a fleet of subs: run agentic AI work across every Claude Code and Codex subscription you own, without rotating logins. Lanes, dispatch front door, quota watchdog, completion notices."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Max Ghenis"}]
requires-python = ">=3.12"
dependencies = []
keywords = ["claude-code", "codex", "agents", "quota", "dispatch", "subscriptions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/MaxGhenis/subfleet"

[project.scripts]
subfleet = "subfleet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["subfleet"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
